---
podSpec:
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
  priorityClassName: system-node-critical
  volumes:
    - name: shared
      emptyDir: {}
  initContainers:
    - name: sync
      image: "{{ .PluginsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - "cp -vf ./entrypoint-tests.sh ./platform.sh /tmp/shared/"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
    - name: login
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - |
          /usr/bin/oc login "${KUBE_API_URL}" \
            --token="$(cat "${SA_TOKEN_PATH}")" \
            --certificate-authority="${SA_CA_PATH}";
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
        - name: KUBE_API_URL
          value: "https://kubernetes.default.svc:443"
        - name: SA_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        - name: SA_CA_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
{{- if .UseK8sTestsExt }}
    - name: extract-k8s-tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - |
          set -euo pipefail

          echo "Extracting k8s-tests-ext from hyperkube image..."

          # Get release image from cluster
          RELEASE_IMAGE=$(oc get clusterversion version -o jsonpath='{.status.desired.image}')
          echo "Release image: ${RELEASE_IMAGE}"

          # Extract image-references
          oc image extract "${RELEASE_IMAGE}" \
            --path=/release-manifests/image-references:/tmp/refs \
            --confirm

          # Parse hyperkube image reference using python
          HYPERKUBE_IMAGE=$(python3 -c "
          import json, sys
          with open('/tmp/refs/image-references') as f:
              data = json.load(f)
              for tag in data.get('spec', {}).get('tags', []):
                  if tag.get('name') == 'hyperkube':
                      print(tag.get('from', {}).get('name', ''))
                      sys.exit(0)
              sys.exit(1)
          ")

          if [ -z "$HYPERKUBE_IMAGE" ]; then
              echo "ERROR: Failed to find hyperkube image in release payload"
              exit 1
          fi

          echo "Hyperkube image: ${HYPERKUBE_IMAGE}"

          # Extract k8s-tests-ext.gz
          oc image extract "${HYPERKUBE_IMAGE}" \
            --path=/usr/bin/k8s-tests-ext.gz:/tmp/shared \
            --confirm

          # Decompress and make executable
          gunzip /tmp/shared/k8s-tests-ext.gz
          chmod +x /tmp/shared/k8s-tests-ext

          echo "k8s-tests-ext extracted successfully"
          /tmp/shared/k8s-tests-ext info || echo "Warning: k8s-tests-ext info command failed (may be expected)"
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
{{- end }}
  containers:
    - name: tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
      command: ["/bin/bash", "/tmp/shared/entrypoint-tests.sh"]
      env:
        - name: KUBECONFIG
          value: /tmp/shared/kubeconfig
        - name: SHARED_DIR
          value: "/tmp/shared"
        - name: DEFAULT_SUITE_NAME
          value: "{{ .KubeConformanceSuiteName }}"
        - name: USE_K8S_TESTS_EXT
          value: "{{ .UseK8sTestsExt }}"
        - name: OT_RUN_COMMAND
          value: "run"
        - name: PLUGIN_NAME
          value: "openshift-kube-conformance"

sonobuoy-config:
  driver: Job
  plugin-name: 10-openshift-kube-conformance
  result-format: junit
  description: |
    OPCT plugin to schedule e2e tests using openshift-tests tool to validate
    an OpenShift Container Platform cluster installed in a specific provider.
  source-url:
    "https://github.com/redhat-openshift-ecosystem/opct/\
    blob/main/manifests/openshift-kube-conformance.yaml"
  skipCleanup: true
spec:
  name: plugin
  image: "{{ .PluginsImage }}"
  command:
    - "/bin/sh"
    - "-c"
    - "/usr/bin/openshift-tests-plugin run --name ${PLUGIN_NAME}"
  imagePullPolicy: Always
  volumeMounts:
    - mountPath: /tmp/sonobuoy/results
      name: results
    - mountPath: /tmp/shared
      name: shared
  env:
    - name: KUBECONFIG
      value: /tmp/shared/kubeconfig
    - name: DEFAULT_SUITE_NAME
      value: "{{ .KubeConformanceSuiteName }}"
    - name: USE_K8S_TESTS_EXT
      value: "{{ .UseK8sTestsExt }}"
    - name: PLUGIN_NAME
      value: "openshift-kube-conformance"
    - name: PLUGIN_ID
      value: "10"
    - name: ENV_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: ENV_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: ENV_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: RUN_MODE
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: run-mode
    - name: DEV_MODE_COUNT
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: dev-count
    - name: MIRROR_IMAGE_REPOSITORY
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: mirror-registry
          optional: true
