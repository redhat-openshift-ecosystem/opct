---
podSpec:
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
  priorityClassName: system-node-critical
  volumes:
    - name: shared
      emptyDir: {}
  initContainers:
    - name: sync
      image: "{{ .PluginsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - "cp -vf ./entrypoint-tests.sh ./platform.sh /tmp/shared/"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
    - name: login
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - |
          /usr/bin/oc login "${KUBE_API_URL}" \
            --token="$(cat "${SA_TOKEN_PATH}")" \
            --certificate-authority="${SA_CA_PATH}";
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
        - name: KUBE_API_URL
          value: "https://kubernetes.default.svc:443"
        - name: SA_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        - name: SA_CA_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
    - name: extract-k8s-conformance-tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-ec"
        - |
          set -o pipefail

          # Extract Kubernetes conformance test list using openshift-tests binary.
          # On OCP 4.20+, the kubernetes/conformance suite was removed from
          # openshift-tests, and conformance tests are loaded from external
          # binaries. Using 'openshift-tests run all --dry-run' extracts tests
          # from all sources (including external binaries) using the cluster's
          # pull secrets for registry auth, then filters for [Conformance] tag.
          DEFAULT_SUITE_NAME="${DEFAULT_SUITE_NAME:-kubernetes/conformance}"
          if [ "${DEFAULT_SUITE_NAME}" == "kubernetes/conformance" ]; then
            echo "Skipping extraction for pre-4.20 clusters"
            exit 0
          fi

          echo "Extracting Kubernetes conformance test list from openshift-tests binary..."
          OUT_FILE="/tmp/shared/k8s-conformance-tests.list"

          /usr/bin/openshift-tests run all --dry-run 2>/dev/null \
            | grep '\[Conformance\]' > "$OUT_FILE" || {
            echo "Warning: Failed to extract conformance tests"
            echo "  Will rely on default suite"
            exit 0
          }

          TEST_COUNT=$(wc -l < "$OUT_FILE")
          echo "Extracted $TEST_COUNT conformance tests"

          if [ "$TEST_COUNT" -gt 0 ]; then
            echo "Kubernetes conformance test extraction successful"
          fi
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
        - name: DEFAULT_SUITE_NAME
          valueFrom:
            configMapKeyRef:
              name: plugins-config
              key: suiteNameKubernetesConformance
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
  containers:
    - name: tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
      command: ["/bin/bash", "/tmp/shared/entrypoint-tests.sh"]
      env:
        - name: KUBECONFIG
          value: /tmp/shared/kubeconfig
        - name: DEFAULT_SUITE_NAME
          valueFrom:
            configMapKeyRef:
              name: plugins-config
              key: suiteNameKubernetesConformance
        - name: OT_RUN_COMMAND
          value: "run"
        - name: PLUGIN_NAME
          value: "openshift-kube-conformance"

sonobuoy-config:
  driver: Job
  plugin-name: 10-openshift-kube-conformance
  result-format: junit
  description: |
    OPCT plugin to schedule e2e tests using openshift-tests tool to validate
    an OpenShift Container Platform cluster installed in a specific provider.
  source-url: >-
    https://github.com/redhat-openshift-ecosystem/opct/
    blob/main/manifests/openshift-kube-conformance.yaml
  skipCleanup: true
spec:
  name: plugin
  image: "{{ .PluginsImage }}"
  command:
    - "/bin/sh"
    - "-c"
    - "/usr/bin/openshift-tests-plugin run --name ${PLUGIN_NAME}"
  imagePullPolicy: Always
  volumeMounts:
    - mountPath: /tmp/sonobuoy/results
      name: results
    - mountPath: /tmp/shared
      name: shared
  env:
    - name: KUBECONFIG
      value: /tmp/shared/kubeconfig
    - name: PLUGIN_NAME
      value: "openshift-kube-conformance"
    - name: PLUGIN_ID
      value: "10"
    - name: ENV_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: ENV_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: ENV_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: RUN_MODE
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: run-mode
    - name: DEV_MODE_COUNT
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: dev-count
    - name: MIRROR_IMAGE_REPOSITORY
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: mirror-registry
          optional: true
    - name: DEFAULT_SUITE_NAME
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: suiteNameKubernetesConformance
