---
podSpec:
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
  priorityClassName: system-node-critical
  volumes:
    - name: shared
      emptyDir: {}
  initContainers:
    - name: sync
      image: "{{ .PluginsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - "cp -vf ./entrypoint-tests.sh ./platform.sh /tmp/shared/"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
    - name: login
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-c"
        - |
          /usr/bin/oc login "${KUBE_API_URL}" \
            --token="$(cat "${SA_TOKEN_PATH}")" \
            --certificate-authority="${SA_CA_PATH}";
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
        - name: KUBE_API_URL
          value: "https://kubernetes.default.svc:443"
        - name: SA_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        - name: SA_CA_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
    - name: extract-k8s-conformance-tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      command:
        - "/bin/bash"
        - "-ec"
        - |
          set -o pipefail

          # Extract Kubernetes conformance test list from k8s-tests-ext binary.
          # On OCP 4.20+, the kubernetes/conformance suite was removed from
          # openshift-tests, and conformance tests are loaded from the external
          # binary k8s-tests-ext shipped inside the hyperkube image.
          # This init container imports the hyperkube image into the cluster's
          # internal registry, then extracts k8s-tests-ext.gz from it, avoiding
          # direct quay.io authentication from the pod.
          DEFAULT_SUITE_NAME="${DEFAULT_SUITE_NAME:-kubernetes/conformance}"
          if [ "${DEFAULT_SUITE_NAME}" == "kubernetes/conformance" ]; then
            echo "Skipping extraction for pre-4.20 clusters"
            exit 0
          fi

          echo "Extracting Kubernetes conformance test list..."
          INIT_ERROR_FILE="/tmp/shared/init-error.log"

          # Helper to log error and exit gracefully so main containers
          # can start and report the error through OPCT status.
          init_error() {
            echo "$1" | tee "$INIT_ERROR_FILE"
            exit 0
          }

          # Extract cluster pull-secret for registry auth (required for
          # CI/nightly builds where the release image is on a private registry).
          PULL_SECRET_ARG=""
          if oc extract secret/pull-secret -n openshift-config --to=/tmp/ --confirm >/dev/null 2>&1; then
            PULL_SECRET_ARG="-a /tmp/.dockerconfigjson"
            echo "Using cluster pull-secret for release image auth"
          fi

          # Get the hyperkube image from the release
          # Capture stdout (image ref) and stderr separately to avoid
          # warnings corrupting the image reference.
          RELEASE_STDERR=$(mktemp)
          TESTS_IMAGE_K8S=$(oc adm release info ${PULL_SECRET_ARG-} --image-for=hyperkube 2>"$RELEASE_STDERR") || \
            init_error "Failed to get hyperkube image from release: $(cat "$RELEASE_STDERR")"
          if [ -z "$TESTS_IMAGE_K8S" ]; then
            init_error "Hyperkube image not found in release payload"
          fi
          echo "Hyperkube image: $TESTS_IMAGE_K8S"

          # Import hyperkube into the cluster's internal registry
          # oc import-image uses the cluster's pull secret automatically.
          # Use a unique tag to avoid collisions with concurrent runs.
          IMPORT_TAG="opct-$(date +%s)"
          trap "oc tag -d openshift/hyperkube:${IMPORT_TAG} 2>/dev/null || true" EXIT
          echo "Importing hyperkube to internal registry with tag ${IMPORT_TAG}..."
          IMPORT_ERR=$(oc import-image "hyperkube:${IMPORT_TAG}" \
            --from="$TESTS_IMAGE_K8S" \
            -n openshift --confirm 2>&1) || \
            init_error "Failed to import hyperkube image: ${IMPORT_ERR}"
          echo "$IMPORT_ERR"

          # Get auth token for the internal registry
          REGISTRY_AUTH="/tmp/registry-auth.json"
          INTERNAL_REGISTRY="image-registry.openshift-image-registry.svc:5000"
          echo "Logging in to internal registry..."
          LOGIN_ERR=$(oc registry login \
            --registry="$INTERNAL_REGISTRY" \
            --insecure \
            --to="$REGISTRY_AUTH" 2>&1) || \
            init_error "Failed to login to internal registry: ${LOGIN_ERR}"
          echo "$LOGIN_ERR"

          # Extract k8s-tests-ext binary from the internal registry
          K8S_EXT_FILE="/usr/bin/k8s-tests-ext.gz"
          K8S_EXT_PATH="$K8S_EXT_FILE:/tmp/shared/"
          echo "Extracting k8s-tests-ext from internal registry..."
          EXTRACT_ERR=$(oc image extract \
            "$INTERNAL_REGISTRY/openshift/hyperkube:${IMPORT_TAG}" \
            --file="$K8S_EXT_FILE" \
            --path="$K8S_EXT_PATH" \
            --confirm --insecure \
            -a "$REGISTRY_AUTH" 2>&1) || \
            init_error "Failed to extract k8s-tests-ext.gz: ${EXTRACT_ERR}"
          echo "$EXTRACT_ERR"

          # Decompress and extract conformance test list
          if [ -f /tmp/shared/k8s-tests-ext.gz ]; then
            gunzip /tmp/shared/k8s-tests-ext.gz
            chmod u+x /tmp/shared/k8s-tests-ext

            echo "Extracting conformance tests list..."
            OUT_FILE="/tmp/shared/k8s-conformance-tests.list"
            JQ_FILTER='.[] | select(.labels | has("Conformance")) | select(.name | contains("[Conformance]")).name'
            if ! JQ_ERR=$(/tmp/shared/k8s-tests-ext list tests \
              | jq "$JQ_FILTER" > "$OUT_FILE" 2>&1); then
              init_error "Failed to extract conformance tests from k8s-tests-ext: ${JQ_ERR}"
            fi

            TEST_COUNT=$(wc -l < "$OUT_FILE")
            echo "Extracted $TEST_COUNT conformance tests"

            if [ "$TEST_COUNT" -gt 0 ]; then
              echo "Kubernetes conformance test extraction successful"
            fi
          fi
      env:
        - name: KUBECONFIG
          value: "/tmp/shared/kubeconfig"
        - name: DEFAULT_SUITE_NAME
          valueFrom:
            configMapKeyRef:
              name: plugins-config
              key: suiteNameKubernetesConformance
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
  containers:
    - name: tests
      image: "{{ .OpenshiftTestsImage }}"
      imagePullPolicy: Always
      volumeMounts:
        - mountPath: /tmp/shared
          name: shared
      command: ["/bin/bash", "/tmp/shared/entrypoint-tests.sh"]
      env:
        - name: KUBECONFIG
          value: /tmp/shared/kubeconfig
        - name: DEFAULT_SUITE_NAME
          valueFrom:
            configMapKeyRef:
              name: plugins-config
              key: suiteNameKubernetesConformance
        - name: OT_RUN_COMMAND
          value: "run"
        - name: PLUGIN_NAME
          value: "openshift-kube-conformance"

sonobuoy-config:
  driver: Job
  plugin-name: 10-openshift-kube-conformance
  result-format: junit
  description: |
    OPCT plugin to schedule e2e tests using openshift-tests tool to validate
    an OpenShift Container Platform cluster installed in a specific provider.
  source-url: >-
    https://github.com/redhat-openshift-ecosystem/opct/
    blob/main/manifests/openshift-kube-conformance.yaml
  skipCleanup: true
spec:
  name: plugin
  image: "{{ .PluginsImage }}"
  command:
    - "/bin/sh"
    - "-c"
    - "/usr/bin/openshift-tests-plugin run --name ${PLUGIN_NAME}"
  imagePullPolicy: Always
  volumeMounts:
    - mountPath: /tmp/sonobuoy/results
      name: results
    - mountPath: /tmp/shared
      name: shared
  env:
    - name: KUBECONFIG
      value: /tmp/shared/kubeconfig
    - name: PLUGIN_NAME
      value: "openshift-kube-conformance"
    - name: PLUGIN_ID
      value: "10"
    - name: ENV_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: ENV_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: ENV_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: RUN_MODE
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: run-mode
    - name: DEV_MODE_COUNT
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: dev-count
    - name: MIRROR_IMAGE_REPOSITORY
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: mirror-registry
          optional: true
    - name: DEFAULT_SUITE_NAME
      valueFrom:
        configMapKeyRef:
          name: plugins-config
          key: suiteNameKubernetesConformance
