name: Automatic Release Tag Creation

# This workflow automates the creation of release tags when a release PR is merged.
#
# Guardrails:
# 1. Only runs when PR targets release-* branch
# 2. Source branch must be 'main'
# 3. Only users in OWNERS (approvers list) can create release PRs
# 4. Tag only created when PR is merged (not just closed)
# 5. Version format must be vX.Y.Z
# 6. Prevents duplicate tags
#
# Usage:
# 1. Create PR from main to release-X.Y
# 2. Add "Release: vX.Y.Z" to PR description
# 3. Merge PR → Tag is automatically created
#
# Manual trigger (for recovery):
# gh workflow run auto-release-tag.yaml -f version=v0.6.1 -f release_branch=release-0.6

on:
  # Trigger 1: When release PR is merged
  pull_request:
    types: [closed]
    branches:
      - 'release-**'     # Matches release-0.6, release-v0.6, etc.

  # Trigger 2: Manual dispatch for recovery
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.6.1)'
        required: true
        type: string
      release_branch:
        description: 'Release branch (e.g., release-0.6)'
        required: true
        type: string

jobs:
  validate-and-create-tag:
    # Only run if PR was merged (not closed without merge)
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog
          ref: ${{ github.event.pull_request.base.ref || inputs.release_branch }}

      - name: Parse version from PR body or input
        id: parse_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract version from PR body (expects: Release: v0.6.1)
            PR_BODY="${{ github.event.pull_request.body }}"
            VERSION=$(echo "$PR_BODY" | grep -oP 'Release:\s*\Kv[0-9]+\.[0-9]+\.[0-9]+' || echo "")

            # Fallback: try PR title
            if [ -z "$VERSION" ]; then
              PR_TITLE="${{ github.event.pull_request.title }}"
              VERSION=$(echo "$PR_TITLE" | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "")
            fi
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not parse version from PR. Add 'Release: vX.Y.Z' to PR description."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Detected version: $VERSION"

      - name: Validate PR source and target branches
        if: github.event_name == 'pull_request'
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"

          # Guardrail 1: Target must be release-X.Y branch
          if ! [[ "$BASE_BRANCH" =~ ^release- ]]; then
            echo "❌ Error: Target branch must be a release branch (release-X.Y)"
            echo "   Found: $BASE_BRANCH"
            exit 1
          fi

          # Guardrail 2: Source must be main branch
          if [[ "$HEAD_BRANCH" != "main" ]]; then
            echo "❌ Error: Source branch must be 'main'"
            echo "   Found: $HEAD_BRANCH"
            exit 1
          fi

          echo "✅ Branch validation passed: $HEAD_BRANCH → $BASE_BRANCH"

      - name: Load and validate OWNERS
        id: owners
        run: |
          # Parse OWNERS file for approvers
          if [ ! -f "OWNERS" ]; then
            echo "❌ Error: OWNERS file not found"
            exit 1
          fi

          # Extract approvers list (YAML format)
          APPROVERS=$(awk '/^approvers:/,/^[a-z]/' OWNERS | grep '^-' | sed 's/^- //' | tr '\n' ',' | sed 's/,$//')
          echo "approvers=$APPROVERS" >> $GITHUB_OUTPUT
          echo "📋 Approvers: $APPROVERS"

      - name: Validate PR author permissions
        if: github.event_name == 'pull_request'
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          APPROVERS="${{ steps.owners.outputs.approvers }}"

          # Guardrail 3: Only OWNERS can create release PRs
          if ! echo ",$APPROVERS," | grep -q ",$PR_AUTHOR,"; then
            echo "❌ Error: User '$PR_AUTHOR' is not in OWNERS approvers list"
            echo "   Approvers: $APPROVERS"
            exit 1
          fi

          echo "✅ Permission check passed: $PR_AUTHOR is an approver"

      - name: Validate version format
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Version must match format vX.Y.Z (e.g., v0.6.1)"
            echo "   Found: $VERSION"
            exit 1
          fi

          echo "✅ Version format validated: $VERSION"

      - name: Check if tag already exists
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Error: Tag $VERSION already exists"
            git show "$VERSION" --no-patch
            exit 1
          fi

          echo "✅ Tag does not exist: $VERSION"

      - name: Verify PR is merged (not just closed)
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "❌ Error: PR was closed without merging"
            exit 1
          fi

          echo "✅ PR was successfully merged"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            echo "📝 Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD \
              --pretty=format:"- %s (%h)" \
              --no-merges \
              --grep='^feat:' --grep='^fix:' --grep='^chore:' --grep='^refactor:' \
              --extended-regexp)
          else
            echo "📝 No previous tag found, using recent commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          # Save to multiline output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"
          PREV_TAG="${{ steps.changelog.outputs.prev_tag }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag message
          cat > tag_message.txt <<EOF
          Release $VERSION

          Changes since ${PREV_TAG:-initial release}:
          ${CHANGELOG}

          ---
          🤖 Automated release created via GitHub Actions
          Workflow: ${{ github.workflow }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          # Create annotated tag
          git tag -a "$VERSION" -F tag_message.txt

          # Push tag
          git push origin "$VERSION"

          echo "✅ Tag $VERSION successfully created and pushed"

      - name: Verify tag was pushed
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"

          sleep 2  # Wait for remote to sync

          if ! git ls-remote --tags origin | grep -q "refs/tags/$VERSION"; then
            echo "❌ Error: Tag verification failed"
            exit 1
          fi

          echo "✅ Tag $VERSION verified on remote"

      - name: Post summary
        if: always()
        run: |
          VERSION="${{ steps.parse_version.outputs.version }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref || inputs.release_branch }}"

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Release Tag Creation Summary

          **Version**: \`$VERSION\`
          **Branch**: \`$BASE_BRANCH\`
          **Status**: ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

          ## Next Steps

          1. **Monitor CI Build**
             \`\`\`bash
             gh run list --limit 5
             \`\`\`

          2. **Verify Images Published**
             \`\`\`bash
             skopeo list-tags docker://quay.io/opct/opct | grep $VERSION
             \`\`\`

          3. **Check GitHub Release**
             - Visit: [${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION](${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION)

          ---
          🤖 Automated by GitHub Actions
          EOF
