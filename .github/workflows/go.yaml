---
name: test-build-release
on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: 1.25
  GOLANGCI_LINT_VERSION: v1.59

jobs:
  # Pre jobs: Linter
  linters:
    name: linters
    uses: ./.github/workflows/pre_linters.yaml

  reviewer:
    name: reviewer
    uses: ./.github/workflows/pre_reviewer.yaml

  go-test:
    runs-on: ubuntu-latest
    needs:
      - linters
      - reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run unit tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git -y

      - name: Build (OS=linux-amd64)
        env:
          OS_ARCH: linux-amd64
        run: |
          make clean
          make linux-amd64-container
          make build-${OS_ARCH}

      - name: Save artifacts (OS=linux-amd64)
        uses: actions/upload-artifact@v4
        with:
          name: opct-linux-amd64
          path: |
            build/opct-*

      - name: Build (OS=darwin-arm64)
        env:
          OS_ARCH: darwin-arm64
        run: |
          make clean
          make build-${OS_ARCH}

      - name: Save artifacts (OS=darwin-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: opct-darwin-arm64
          path: |
            build/opct-*

  verify-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - linters
      - reviewer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Extract and verify plugin images from types.go
        run: |
          set -euo pipefail

          REPO=$(grep -E 'DefaultToolsRepository\s*=' pkg/types.go | grep -oP '"[^"]*"' | tr -d '"')
          echo "Registry: ${REPO}"

          # Extract registry host and namespace from REPO (e.g., "quay.io/opct" -> host="quay.io", ns="opct")
          REGISTRY_HOST="${REPO%%/*}"
          NAMESPACE="${REPO#*/}"

          IMAGES=$(grep -E '(PluginsImage|CollectorImage|MustGatherMonitoringImage)\s*=' pkg/types.go | grep -oP '"[^"]*"' | tr -d '"')

          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"

          FAILED=0
          for IMG in $IMAGES; do
            NAME="${IMG%%:*}"
            TAG="${IMG##*:}"
            FULL="${REPO}/${NAME}:${TAG}"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${REGISTRY_HOST}/v2/${NAMESPACE}/${NAME}/manifests/${TAG}" \
              -H "Accept: ${ACCEPT}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ ${FULL}"
            else
              echo "❌ MISSING: ${FULL} (HTTP ${HTTP_CODE})"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::One or more plugin images are missing on quay.io. Ensure provider-certification-plugins CI has completed successfully before bumping versions in pkg/types.go."
            exit 1
          fi

          echo ""
          echo "All plugin images verified successfully."

  e2e:
    needs:
      - build
      - verify-images
    uses: ./.github/workflows/e2e.yaml

  #
  # Release job creates container images for latest (main) or release tags.
  # When a tag is created, a new Github Release is created with the changelog.
  #
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: e2e
    env:
      PLATFORMS: linux/amd64
      BUILD_EXPIRATION: never
      PUSH: true
      REPO_URL: https://quay.io/repository/opct/opct?tab=tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set vars for tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |-
          echo "BUILD_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set vars for main
        if: github.ref == 'refs/heads/main'
        run: |-
          echo "BUILD_VERSION=latest" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_OPCT_USER }}
          password: ${{ secrets.QUAY_OPCT_PASS }}

      - name: "Build and push: quay.io/opct/opct"
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH }}
          provenance: false
          labels: |
            quay.expires-after=${BUILD_EXPIRATION}
          build-args: |
            QUAY_EXPIRATION=${BUILD_EXPIRATION}
            RELEASE_TAG=${{ env.BUILD_VERSION }}
          tags: quay.io/opct/opct:${{ env.BUILD_VERSION }}
          file: ./hack/Containerfile

      - name: Install dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install make git -y

      - name: Build (all OS) for Github Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make linux-amd64-container
          make build-linux-amd64
          make build-windows-amd64
          make build-darwin-amd64
          make build-darwin-arm64

      # https://github.com/mikepenz/release-changelog-builder-action#configuration
      - name: Build Changelog when tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v3.7.0
        with:
          configuration: ".github/workflows/changelog-configuration.json"

      # https://github.com/softprops/action-gh-release
      - name: Create Release on Github when tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v0.1.15
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
          REPO: quay.io/opct/opct
        with:
          prerelease: true
          files: |
            build/opct-darwin-amd64
            build/opct-darwin-amd64.sum
            build/opct-darwin-arm64
            build/opct-darwin-arm64.sum
            build/opct-linux-amd64
            build/opct-linux-amd64.sum
            build/opct-windows-amd64.exe
            build/opct-windows-amd64.exe.sum
          body: |
            ## Changelog
            ${{steps.github_release.outputs.changelog}}

            ## Images
            - [quay.io/opct/opct:${{ env.VERSION }}](${{ env.REPO_URL }})
