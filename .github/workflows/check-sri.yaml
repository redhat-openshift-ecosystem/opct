name: Check CDN SRI

on:
  pull_request:
    paths:
      - '**/*.html'
  push:
    branches:
      - main

jobs:
  check-sri:
    name: Verify CDN dependencies have SRI and pinned versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CDN whitelist, version pinning, and SRI
        run: |
          echo "========================================"
          echo "CDN SECURITY CHECK"
          echo "========================================"
          echo ""

          # Whitelist of allowed CDN hosts
          ALLOWED_CDNS=(
            "cdn.jsdelivr.net"
            "unpkg.com"
          )

          echo "Requirements:"
          echo "  1. CDN host must be whitelisted"
          echo "  2. CDN version must be pinned (no @latest, no @major-only)"
          echo "  3. All dependencies must have SRI (Subresource Integrity)"
          echo "  4. Each element must have its own integrity hash"
          echo ""
          echo "Allowed CDN hosts:"
          printf '  - %s\n' "${ALLOWED_CDNS[@]}"
          echo ""

          # Find all HTML files and check for CDN URLs
          failed=0
          while IFS= read -r file; do
            echo "Checking $file..."

            # Extract all external script/link elements with CDN URLs
            # This handles single-quoted, double-quoted, and unquoted attributes
            elements=$(grep -nE '<(script|link)[^>]*(src|href)=["\']?https?://[^"\'>\s]+' "$file" 2>/dev/null || true)

            if [ -z "$elements" ]; then
              echo "  ℹ️  No CDN dependencies found"
              continue
            fi

            # Process each element individually
            while IFS= read -r line_info; do
              [ -z "$line_info" ] && continue

              line_num=$(echo "$line_info" | cut -d: -f1)
              line_content=$(echo "$line_info" | cut -d: -f2-)

              # Extract the complete element (script or link tag)
              if [[ "$line_content" == *"<script"* ]]; then
                element_type="script"
              elif [[ "$line_content" == *"<link"* ]]; then
                element_type="link"
              else
                continue
              fi

              # Extract URL - handle both single and double quotes
              url=$(echo "$line_content" | sed -E 's/.*\b(src|href)=["'"'"']?([^"'"'"'>\s]+).*/\2/')
              [ -z "$url" ] && continue

              # Extract host from URL
              host=$(echo "$url" | sed -E 's|https?://([^/]+).*|\1|')

              # Check if host is in whitelist
              allowed=0
              for cdn in "${ALLOWED_CDNS[@]}"; do
                if [[ "$host" == "$cdn" ]]; then
                  allowed=1
                  break
                fi
              done

              if [ $allowed -eq 0 ]; then
                echo "  ❌ Line $line_num: Unauthorized CDN host: $host"
                echo "     URL: $url"
                failed=1
                continue
              fi

              # Check for @latest (unpinned version)
              if [[ "$url" == *"@latest"* ]]; then
                echo "  ❌ Line $line_num: Unpinned version @latest detected"
                echo "     URL: $url"
                echo "     Fix: Pin to specific version (e.g., @2.7.14)"
                failed=1
                continue
              fi

              # Special validation for Vue.js: must use semver (e.g., @2.7.14, not @2 or @2.7)
              if [[ "$url" == *"/vue@"* ]]; then
                if ! [[ "$url" =~ /vue@[0-9]+\.[0-9]+\.[0-9] ]]; then
                  echo "  ❌ Line $line_num: Vue version not fully pinned (semver required)"
                  echo "     URL: $url"
                  echo "     Fix: Use exact semver like @2.7.14"
                  failed=1
                  continue
                fi
              fi

              # Check if this element has SRI hash on the same line
              if ! echo "$line_content" | grep -q 'integrity='; then
                echo "  ❌ Line $line_num: Missing SRI hash"
                echo "     URL: $url"
                failed=1
              else
                echo "  ✅ Line $line_num: $element_type [$host] - pinned + SRI"
              fi
            done <<< "$elements"

            echo ""
          done < <(find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./build/*")

          if [ $failed -eq 1 ]; then
            echo ""
            echo "=========================================="
            echo "CDN SECURITY CHECK FAILED"
            echo "=========================================="
            echo ""
            echo "Fix unpinned dependencies:"
            echo "1. Replace @latest with specific version"
            echo "   OLD: https://unpkg.com/bootstrap-vue@latest/dist/..."
            echo "   NEW: https://unpkg.com/bootstrap-vue@2.23.1/dist/..."
            echo ""
            echo "2. For Vue.js, use full semver:"
            echo "   OLD: https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"
            echo "   NEW: https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"
            echo ""
            echo "3. Generate SRI hash for the URL:"
            echo "   curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A"
            echo ""
            echo "4. Add to HTML tag:"
            echo "   integrity=\"sha384-<HASH>\" crossorigin=\"anonymous\""
            echo ""
            exit 1
          fi

          echo "=========================================="
          echo "✅ CDN SECURITY CHECK PASSED"
          echo "=========================================="
          echo "All CDN dependencies:"
          echo "  - Use whitelisted hosts only"
          echo "  - Have pinned versions (no @latest, semver for Vue)"
          echo "  - Have SRI (Subresource Integrity) hashes"
          echo "  - Each element has its own integrity attribute"
