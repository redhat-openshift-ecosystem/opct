name: Check CDN SRI

on:
  pull_request:
    paths:
      - '**/*.html'
  push:
    branches:
      - main

jobs:
  check-sri:
    name: Verify CDN dependencies have SRI and pinned versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CDN whitelist, version pinning, and SRI
        run: |
          echo "=========================================="
          echo "CDN SECURITY CHECK"
          echo "=========================================="

          failed=0

          # Check report.html and filter.html
          for file in data/templates/report/report.html data/templates/report/filter.html; do
            echo ""
            echo "Checking $file..."

            # Check 1: No unauthorized CDN hosts (only cdn.jsdelivr.net and unpkg.com allowed)
            if grep -q 'https://[^"]*' "$file" | grep -v 'cdn.jsdelivr.net\|unpkg.com'; then
              echo "❌ FAIL: Found unauthorized CDN hosts"
              failed=1
            fi

            # Check 2: No @latest versions
            if grep -q '@latest' "$file"; then
              echo "❌ FAIL: Found @latest (unpinned) versions"
              grep -n '@latest' "$file" || true
              failed=1
            fi

            # Check 3: Vue.js must use exact semver (e.g., @2.7.14, not @2)
            if grep -q 'vue@2"' "$file" || grep -q "vue@2'" "$file" || grep -q 'vue@2 ' "$file"; then
              echo "❌ FAIL: Vue.js not pinned to semver (use @2.7.14, not @2)"
              grep -n 'vue@2' "$file" || true
              failed=1
            fi

            # Check 4: All CDN script/link tags must have integrity attribute
            cdn_count=$(grep -c 'https://cdn.jsdelivr.net\|https://unpkg.com' "$file" || true)
            sri_count=$(grep 'https://cdn.jsdelivr.net\|https://unpkg.com' "$file" | grep -c 'integrity=' || true)

            if [ "$cdn_count" -ne "$sri_count" ]; then
              echo "❌ FAIL: Not all CDN dependencies have SRI hashes"
              echo "   Found $cdn_count CDN URLs, but only $sri_count have integrity"
              failed=1
            fi

            # Check 5: Valid SRI format (sha384-<base64>)
            if grep 'integrity=' "$file" | grep -v 'sha384-'; then
              echo "❌ FAIL: Invalid SRI format (must be sha384-...)"
              failed=1
            fi

            if [ $failed -eq 0 ]; then
              echo "✅ PASS: $file"
              echo "   - No unauthorized CDNs"
              echo "   - All versions pinned (no @latest)"
              echo "   - Vue.js uses semver"
              echo "   - All CDN deps have SRI hashes"
            fi
          done

          echo ""
          if [ $failed -eq 1 ]; then
            echo "=========================================="
            echo "❌ CDN SECURITY CHECK FAILED"
            echo "=========================================="
            exit 1
          else
            echo "=========================================="
            echo "✅ CDN SECURITY CHECK PASSED"
            echo "=========================================="
          fi
