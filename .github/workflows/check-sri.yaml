name: Check CDN SRI

on:
  pull_request:
    paths:
      - '**/*.html'
  push:
    branches:
      - main

jobs:
  check-sri:
    name: Verify CDN dependencies have SRI and pinned versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CDN security
        run: bash hack/check-cdn-sri.sh
