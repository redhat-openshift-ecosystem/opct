name: Check CDN SRI

on:
  pull_request:
    paths:
      - '**/*.html'
  push:
    branches:
      - main

jobs:
  check-sri:
    name: Verify CDN dependencies have SRI and pinned versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CDN whitelist, version pinning, and SRI
        run: |
          echo "========================================"
          echo "CDN SECURITY CHECK"
          echo "========================================"
          echo ""

          # Whitelist of allowed CDN hosts
          ALLOWED_CDNS=(
            "cdn.jsdelivr.net"
            "unpkg.com"
          )

          echo "Requirements:"
          echo "  1. CDN host must be whitelisted"
          echo "  2. CDN version must be pinned (no @latest)"
          echo "  3. All dependencies must have SRI (Subresource Integrity)"
          echo ""
          echo "Allowed CDN hosts:"
          printf '  - %s\n' "${ALLOWED_CDNS[@]}"
          echo ""

          # Find all HTML files and check for CDN URLs
          failed=0
          while IFS= read -r file; do
            echo "Checking $file..."

            # Extract CDN script and stylesheet URLs only
            cdn_urls=$(grep -oE '(<script[^>]+src="|<link[^>]+href=")https?://[^"]+' "$file" | sed 's/.*="//; s/"$//' || true)

            cdn_count=0
            # Check each CDN URL
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              cdn_count=$((cdn_count + 1))

              # Extract host from URL
              host=$(echo "$url" | sed -E 's|https?://([^/]+).*|\1|')

              # Check if host is in whitelist
              allowed=0
              for cdn in "${ALLOWED_CDNS[@]}"; do
                if [[ "$host" == "$cdn" ]]; then
                  allowed=1
                  break
                fi
              done

              if [ $allowed -eq 0 ]; then
                echo "  ❌ FAIL: Unauthorized CDN host: $host"
                echo "     URL: $url"
                failed=1
                continue
              fi

              # Check for @latest (unpinned version)
              if [[ "$url" == *"@latest"* ]]; then
                echo "  ❌ FAIL: Unpinned version @latest"
                echo "     URL: $url"
                echo "     Fix: Pin to specific version (e.g., @2.23.1)"
                failed=1
                continue
              fi

              # Check if this CDN URL has SRI on the same line
              line=$(grep -F "$url" "$file" || true)
              if ! echo "$line" | grep -q 'integrity='; then
                echo "  ❌ FAIL: Missing SRI hash"
                echo "     URL: $url"
                failed=1
              else
                echo "  ✅ $host - pinned + SRI"
              fi
            done <<< "$cdn_urls"

            if [ $cdn_count -eq 0 ]; then
              echo "  ℹ️  No CDN dependencies"
            fi
            echo ""
          done < <(find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./build/*")

          if [ $failed -eq 1 ]; then
            echo ""
            echo "=========================================="
            echo "CDN SECURITY CHECK FAILED"
            echo "=========================================="
            echo ""
            echo "Fix unpinned dependencies:"
            echo "1. Replace @latest with specific version"
            echo "   OLD: https://unpkg.com/bootstrap-vue@latest/dist/..."
            echo "   NEW: https://unpkg.com/bootstrap-vue@2.23.1/dist/..."
            echo ""
            echo "2. Generate SRI hash for the URL:"
            echo "   curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A"
            echo ""
            echo "3. Add to HTML tag:"
            echo "   integrity=\"sha384-<HASH>\" crossorigin=\"anonymous\""
            echo ""
            exit 1
          fi

          echo "=========================================="
          echo "✅ CDN SECURITY CHECK PASSED"
          echo "=========================================="
          echo "All CDN dependencies:"
          echo "  - Use whitelisted hosts only"
          echo "  - Have pinned versions (no @latest)"
          echo "  - Have SRI (Subresource Integrity) hashes"
